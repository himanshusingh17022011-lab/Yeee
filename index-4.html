<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Middle Finger</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#111827,#374151);font-family:Arial,sans-serif}
.container{text-align:center}
.hand{position:relative;width:220px;height:320px;margin:auto}
.middle{position:absolute;width:65px;height:210px;background:#f4b183;border:4px solid #8b5135;border-radius:35px 35px 15px 15px;left:77px;top:0;z-index:2}
.palm{position:absolute;width:180px;height:155px;background:#f4b183;border:4px solid #8b5135;border-radius:50px 50px 35px 35px;left:20px;top:145px;z-index:1}
.finger{position:absolute;width:52px;height:100px;background:#e69a6c;border:4px solid #8b5135;border-radius:26px;top:135px;z-index:3}
.one{left:30px;transform:rotate(-10deg)}
.two{left:84px}
.three{left:138px;transform:rotate(10deg)}
.thumb{position:absolute;width:62px;height:100px;background:#f4b183;border:4px solid #8b5135;border-radius:32px;left:142px;top:165px;transform:rotate(35deg);z-index:4}
h1{color:white;font-size:24px;margin-top:15px}
p{color:#d1d5db;font-size:14px}
</style>
</head>
<body>
<div class="container">
<div class="hand">
<div class="middle"></div>
<div class="palm"></div>
<div class="finger one"></div>
<div class="finger two"></div>
<div class="finger three"></div>
<div class="thumb"></div>
</div>
<h1>Middle Finger ✋</h1>
<p>CSS Illustration</p>
</div>
</body>
</html>
